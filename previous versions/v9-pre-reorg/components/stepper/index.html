<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --primary: #ff4b4b;
    --text: #31333f;
    --bg: #ffffff;
    --border: #d2d4d8;
    --muted: #808495;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--text);
    user-select: none;
  }
  .wrap { padding: 2px 0 6px 0; }
  .label-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--text);
  }
  .info-wrap {
    position: relative;
    display: inline-flex;
    flex: none;
  }
  .info {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--muted);
    color: var(--bg);
    font-size: 10px;
    font-style: italic;
    font-family: Georgia, serif;
    cursor: help;
    flex: none;
  }
  .tip {
    display: none;
    position: relative;
    margin: 4px 0 2px 0;
    padding: 7px 9px;
    background: var(--text);
    color: var(--bg);
    border-radius: 6px;
    font-size: 11.5px;
    line-height: 1.4;
    font-style: normal;
  }
  .row {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    height: 38px;
  }
  button.step {
    width: 34px;
    flex: none;
    border: none;
    background: var(--bg);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.step:hover { background: rgba(255,75,75,0.08); color: var(--primary); }
  button.step:active { background: rgba(255,75,75,0.18); }
  button.step:disabled { opacity: 0.35; cursor: default; background: var(--bg); color: var(--text); }
  input.value {
    flex: 1;
    min-width: 0;
    border: none;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    text-align: center;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label-row">
      <span id="label"></span>
      <span class="info-wrap" id="infoWrap" style="display:none;">
        <span class="info" id="info">i</span>
      </span>
    </div>
    <div class="tip" id="tip"></div>
    <div class="row">
      <button class="step" id="minus" type="button">−</button>
      <input class="value" id="value" inputmode="decimal" />
      <button class="step" id="plus" type="button">+</button>
    </div>
  </div>

<script>
  var initialized = false;
  var currentValue = 0;
  var step = 1;
  var minValue = null;
  var maxValue = null;
  var decimals = 0;
  var prefix = "";
  var suffix = "";
  var thousands = false;

  var labelEl = document.getElementById("label");
  var infoWrapEl = document.getElementById("infoWrap");
  var infoEl = document.getElementById("info");
  var tipEl = document.getElementById("tip");
  var inputEl = document.getElementById("value");
  var minusEl = document.getElementById("minus");
  var plusEl = document.getElementById("plus");

  var repeatTimer = null;
  var repeatDelay = 0;
  var lastSent = null;

  function clamp(v) {
    if (minValue !== null && minValue !== undefined && v < minValue) v = minValue;
    if (maxValue !== null && maxValue !== undefined && v > maxValue) v = maxValue;
    return v;
  }

  function formatNumber(num) {
    var s = Number(num).toFixed(decimals);
    if (thousands) {
      var parts = s.split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      s = parts.join(".");
    }
    return s;
  }

  function displayValue() {
    inputEl.value = prefix + formatNumber(currentValue) + suffix;
    minusEl.disabled = (minValue !== null && minValue !== undefined && currentValue <= minValue);
    plusEl.disabled = (maxValue !== null && maxValue !== undefined && currentValue >= maxValue);
  }

  function parseInput(str) {
    var cleaned = String(str).replace(/[^0-9.\-]/g, "");
    var v = parseFloat(cleaned);
    if (isNaN(v)) v = currentValue;
    return v;
  }

  function sendValue(force) {
    if (force || currentValue !== lastSent) {
      lastSent = currentValue;
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: currentValue,
        dataType: "json"
      }, "*");
    }
  }

  function doStep(direction) {
    currentValue = clamp(round(currentValue + direction * step));
    displayValue();
    sendValue(false);
  }

  function round(v) {
    var f = Math.pow(10, decimals);
    return Math.round(v * f) / f;
  }

  function startRepeat(direction) {
    stopRepeat();
    doStep(direction);
    repeatDelay = 380;
    function tick() {
      doStep(direction);
      repeatDelay = Math.max(70, repeatDelay - 25);
      repeatTimer = setTimeout(tick, repeatDelay);
    }
    repeatTimer = setTimeout(tick, repeatDelay);
  }

  function stopRepeat() {
    if (repeatTimer) { clearTimeout(repeatTimer); repeatTimer = null; }
  }

  minusEl.addEventListener("mousedown", function (e) { e.preventDefault(); startRepeat(-1); });
  plusEl.addEventListener("mousedown", function (e) { e.preventDefault(); startRepeat(1); });
  window.addEventListener("mouseup", stopRepeat);
  minusEl.addEventListener("mouseleave", stopRepeat);
  plusEl.addEventListener("mouseleave", stopRepeat);
  minusEl.addEventListener("touchstart", function (e) { e.preventDefault(); startRepeat(-1); }, { passive: false });
  plusEl.addEventListener("touchstart", function (e) { e.preventDefault(); startRepeat(1); }, { passive: false });
  window.addEventListener("touchend", stopRepeat);
  window.addEventListener("touchcancel", stopRepeat);

  infoWrapEl.addEventListener("mouseenter", function () {
    if (tipEl.textContent) { tipEl.style.display = "block"; setFrameHeight(); }
  });
  infoWrapEl.addEventListener("mouseleave", function () {
    tipEl.style.display = "none";
    setFrameHeight();
  });

  inputEl.addEventListener("focus", function () { inputEl.select(); });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { inputEl.blur(); }
  });
  inputEl.addEventListener("blur", function () {
    currentValue = clamp(round(parseInput(inputEl.value)));
    displayValue();
    sendValue(false);
  });

  function setFrameHeight() {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: document.body.scrollHeight + 4
    }, "*");
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || !data.type || data.type.indexOf("streamlit:") !== 0) return;
    if (data.type === "streamlit:render") {
      var args = data.args || {};
      step = args.step !== undefined ? args.step : 1;
      minValue = args.min_value !== undefined ? args.min_value : null;
      maxValue = args.max_value !== undefined ? args.max_value : null;
      decimals = args.decimals !== undefined ? args.decimals : 0;
      prefix = args.prefix || "";
      suffix = args.suffix || "";
      thousands = !!args.thousands;
      labelEl.textContent = args.label || "";
      if (args.help) {
        infoWrapEl.style.display = "inline-flex";
        tipEl.textContent = args.help;
      } else {
        infoWrapEl.style.display = "none";
        tipEl.textContent = "";
      }
      if (data.theme) {
        var t = data.theme;
        if (t.primaryColor) document.documentElement.style.setProperty("--primary", t.primaryColor);
        if (t.textColor) document.documentElement.style.setProperty("--text", t.textColor);
        if (t.backgroundColor) document.documentElement.style.setProperty("--bg", t.backgroundColor);
      }
      if (!initialized) {
        currentValue = clamp(round(args.value !== undefined ? args.value : 0));
        initialized = true;
        sendValue(true);
      }
      displayValue();
      setFrameHeight();
    }
  });

  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  setTimeout(setFrameHeight, 50);
</script>
</body>
</html>
