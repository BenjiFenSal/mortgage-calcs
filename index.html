<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mortgage Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- ⬇️ Replace this with your real Streamlit Community Cloud URL once deployed, e.g.
     https://mortgage-calcs.streamlit.app — see v2/SETUP.md Part 5. -->
<meta http-equiv="refresh" content="0; url=https://REPLACE-WITH-YOUR-APP.streamlit.app" />

<style>
  html, body {
    height: 100%; margin: 0; display: flex; align-items: center; justify-content: center;
    background: #f4f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #10241d; text-align: center;
  }
  .card {
    background: #fff; border-radius: 18px; padding: 40px 44px; max-width: 420px;
    box-shadow: 0 1px 2px rgba(16,36,29,0.04), 0 6px 16px rgba(16,36,29,0.08);
  }
  .badge {
    width: 48px; height: 48px; border-radius: 14px; background: #12805c; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    margin: 0 auto 18px auto;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  p { color: #7c8985; font-size: 14px; line-height: 1.5; margin: 0 0 22px 0; }
  a.btn {
    display: inline-block; background: #12805c; color: #fff; text-decoration: none;
    padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 14px;
  }
  a.btn:hover { background: #0b5c40; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">🏡</div>
    <h1>Mortgage Dashboard</h1>
    <p>Redirecting you to the live app…</p>
    <!-- ⬇️ Same URL as the meta refresh above — keep both in sync. -->
    <a class="btn" href="https://REPLACE-WITH-YOUR-APP.streamlit.app">Open the dashboard</a>
  </div>
</body>
</html>
